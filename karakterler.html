    }
];

let currentIndex = 0;

function initCards() {
    shuffleArray(charDB);

    const container = document.getElementById('cards-container');
    
    // Kartları ters sırayla ekleyelim ki ilk kart en üstte (z-index yüksek) olsun.
    for (let i = charDB.length - 1; i >= 0; i--) {
        const c = charDB[i];
        const el = document.createElement('div');
        el.className = 'swipe-card';
        el.id = 'card-' + i;
        el.style.zIndex = charDB.length - i;
        
        // Ufak bir rotasyon ve kayma efekti vererek deste hissi uyandıralım
        let randomRot = (Math.random() * 4) - 2;
        let scale = 1 - (i * 0.02);
        let topOffset = i * 5;
        
        // Sadece ilk 3 kartı görünür ve dizilmiş yap, gerisini düz ve arkada bırak
        if(i > 2) {
            randomRot = 0; scale = 0.94; topOffset = 15;
        }
        
        el.style.transform = `translateY(${topOffset}px) scale(${scale}) rotate(${randomRot}deg)`;
        
        el.innerHTML = `
            <img src="${c.image}" alt="${c.name}" class="card-image" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=' + encodeURIComponent('${c.name}') + '&background=8E523A&color=fff&size=200';">
            <div class="card-name">${c.name}</div>
            <div class="card-title">${c.title}</div>
            <div class="card-quote" style="font-size: 0.90rem; line-height: 1.5; text-align: justify; font-style: normal; opacity: 0.90;">${c.summary}</div>
            <div class="card-actions">
                <button class="c-btn no" onclick="swipeCard(${i}, 'left')"><i class="fa-solid fa-arrow-left-long"></i></button>
                <button class="c-btn yes" onclick="swipeCard(${i}, 'right')"><i class="fa-solid fa-arrow-right-long"></i></button>
            </div>
        `;
        container.appendChild(el);
    }
}

let isAnimating = false;

function swipeCard(index, direction) {
    if(index !== currentIndex || isAnimating) return; 
    
    const card = document.getElementById('card-' + index);
    if(!card) return;
    
    isAnimating = true;
    
    // Animasyon ekle
    if(direction === 'left') card.classList.add('swipe-left');
    else card.classList.add('swipe-right');
    
    setTimeout(() => {
        card.style.display = 'none';
        currentIndex++;
        
        // Alttaki kartlarin pozisyonunu guncelle
        updateDeckPositions();
        
        if (currentIndex >= charDB.length) {
            document.getElementById('end-message').style.opacity = '1';
            unlockBadge('kart_kasifi');
        }
        isAnimating = false;
    }, 500);
}

function updateDeckPositions() {
    for (let i = currentIndex; i < charDB.length; i++) {
        let card = document.getElementById('card-' + i);
        let pos = i - currentIndex; // Yeni derinlik sırası
        
        let randomRot = (Math.random() * 4) - 2;
        let scale = 1 - (pos * 0.02);
        let topOffset = pos * 5;
        
        if(pos > 2) { randomRot = 0; scale = 0.94; topOffset = 15; }
        
        card.style.transform = `translateY(${topOffset}px) scale(${scale}) rotate(${randomRot}deg)`;
    }
}



// Deste karıştırma fonksiyonu
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

// Touch events for swiping
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
});

function handleSwipe() {
    if (currentIndex >= charDB.length) return;
    const swipeThreshold = 50;
    if (touchEndX < touchStartX - swipeThreshold) {
        swipeCard(currentIndex, 'left');
    }
    if (touchEndX > touchStartX + swipeThreshold) {
        swipeCard(currentIndex, 'right');
    }
}

// Keyboard events for swiping
document.addEventListener('keydown', e => {
    if (currentIndex >= charDB.length) return;
    if (e.key === 'ArrowLeft') {
        swipeCard(currentIndex, 'left');
    } else if (e.key === 'ArrowRight') {
        swipeCard(currentIndex, 'right');
    }
});

window.addEventListener('DOMContentLoaded', initCards);
</script>
